# Detecta prefixo do Homebrew (em M4 deve ser /opt/homebrew)
- name: "macOS | Detect Homebrew prefix"
  ansible.builtin.command: brew --prefix
  register: brew_prefix
  changed_when: false
  become: false

# Precria /opt/homebrew/cli-plugins com owner do usuário (evita brew tentar sudo)
- name: "macOS | Pre-create cli-plugins dir"
  ansible.builtin.file:
    path: "{{ brew_prefix.stdout }}/cli-plugins"
    state: directory
    mode: "0755"
    owner: "{{ ansible_env.USER }}"
    group: "staff"
  become: true

# Garante ~/Applications para instalar casks sem sudo
- name: "macOS | Ensure ~/Applications exists"
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/Applications"
    state: directory
    mode: "0755"
  become: false

# Instala Docker Desktop (cask) no escopo do usuário
- name: "Docker | MacOSX | Install Docker Desktop"
  community.general.homebrew_cask:
    name: docker
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
    HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    HOMEBREW_CASK_OPTS: "--appdir={{ ansible_user_dir }}/Applications"
  become: false

# (Opcional) CLI via fórmula (útil para scripts/CI)
- name: "Docker | MacOSX | Install docker CLI"
  community.general.homebrew:
    name: docker
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
    HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  become: false

# (Opcional) Abrir/fechar o app (a 1ª vez pode pedir senha do helper via GUI)
- name: "Docker | MacOSX | Restart Docker Desktop (optional)"
  ansible.builtin.shell: |
    osascript -e 'quit app "Docker"' || true
    sleep 2
    open -a "{{ ansible_user_dir }}/Applications/Docker.app"
  args: { executable: /bin/bash }
  changed_when: true
  when: docker_restart|default(false)
  become: false
