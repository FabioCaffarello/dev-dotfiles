- name: DotFiles Config
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Detect Host User
      ansible.builtin.import_tasks: pre_tasks/whoami.yml
      tags:
        - always
    - name: Set Passphrase
      ansible.builtin.import_tasks: pre_tasks/passphrase.yml
      tags:
        - always
  tasks:
    - name: Set roles
      ansible.builtin.set_fact:
        run_roles: >-
          {{
            (
              ansible_run_tags
              | difference(['all', 'always'])
              | select('string')
              | list
            )
            if (ansible_run_tags | difference(['all', 'always']) | length > 0)
            else (default_roles | difference(exclude_roles | default([])) | sort)
          }}
      tags:
        - always
    - name: Run roles
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ run_roles }}"
      tags:
        - always
